[workspace]
resolver = "2"
members = [
    "crates/othello-core",
    "crates/othello-player",
    "crates/othello-io",
    "crates/othello-engine",
    "crates/othello-cli",
    # 以下は将来の Phase で追加予定
    # "crates/othello-rl",
    # "crates/othello-tui",
    # "crates/othello-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["akitenkrad <yaflam07@gmail.com>"]
repository = "https://github.com/akitenkrad/rs-othello-sim"

[workspace.dependencies]
othello-core = { path = "crates/othello-core" }
othello-player = { path = "crates/othello-player" }
othello-io = { path = "crates/othello-io" }
othello-engine = { path = "crates/othello-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# dev-dependencies (テスト・ベンチ共通)
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
