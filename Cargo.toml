[workspace]
resolver = "2"
members = [
    "crates/othello-core",
    "crates/othello-player",
    "crates/othello-io",
    "crates/othello-engine",
    "crates/othello-cli",
    "crates/othello-tui",
    "crates/othello-rl",
    "crates/othello-nn",
    "crates/othello-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["akitenkrad <yaflam07@gmail.com>"]
repository = "https://github.com/akitenkrad/rs-othello-sim"

[workspace.dependencies]
othello-core = { path = "crates/othello-core" }
othello-player = { path = "crates/othello-player" }
othello-io = { path = "crates/othello-io" }
othello-engine = { path = "crates/othello-engine" }
othello-tui = { path = "crates/othello-tui" }
othello-rl = { path = "crates/othello-rl" }
othello-nn = { path = "crates/othello-nn" }

candle-core = "0.7"
candle-nn = "0.7"
candle-onnx = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ratatui = "0.28"
crossterm = "0.28"
ndarray = { version = "0.16", features = ["serde"] }
rayon = "1"
pyo3 = { version = "0.22", default-features = false, features = ["macros"] }
numpy = "0.22"
indicatif = "0.17"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# dev-dependencies (テスト・ベンチ共通)
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
