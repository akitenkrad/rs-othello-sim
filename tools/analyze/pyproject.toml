[project]
name = "analyze"
version = "0.1.0"
description = "Statistical analysis for rs-othello-sim game records"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.scripts]
analyze-stats = "analyze.stats:main"
analyze-compare = "analyze.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyze"]
