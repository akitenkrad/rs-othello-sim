[project]
name = "visualize"
version = "0.1.0"
description = "Game record and learning curve visualization"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
plot-game = "visualize.plot_game:main"
plot-curve = "visualize.plot_curve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualize"]
