[project]
name = "tb-converter"
version = "0.1.0"
description = "Convert rs-othello-sim JSONL logs into TensorBoard event files"
requires-python = ">=3.11"
dependencies = [
    "tensorboard>=2.15",
    "tensorboardx>=2.6",
]

[project.scripts]
jsonl-to-tb = "tb_converter.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_converter"]
