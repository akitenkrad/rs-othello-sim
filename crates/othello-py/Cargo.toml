[package]
name = "othello-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for rs-othello-sim ( PyO3 / maturin)"

[lib]
name = "othello_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
othello-core = { workspace = true }
othello-player = { workspace = true }
othello-engine = { workspace = true }
othello-rl = { workspace = true }
othello-io = { workspace = true }
pyo3 = { workspace = true }
numpy = { workspace = true }
ndarray = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]
