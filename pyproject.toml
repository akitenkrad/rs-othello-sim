[project]
name = "rs-othello-sim-tools"
version = "0.1.0"
description = "Python tools for rs-othello-sim"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "tools/visualize",
    "tools/analyze",
    "tools/tb_converter",
    "crates/othello-py",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = [
    "tools/visualize/tests",
    "tools/analyze/tests",
    "tools/tb_converter/tests",
]
